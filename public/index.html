<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDT Sender</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>USDT Sender</h1>
    <p class="subtitle">Sends USDT from the server wallet (no wallet connection)</p>

    <label for="auth">Access token</label>
    <input type="password" id="auth" placeholder="APP_AUTH_TOKEN" />

    <div id="wallet-status" class="wallet-status hidden">
      <div class="wallet-row">
        <span class="wallet-label">Wallet</span>
        <span id="wallet-addr" class="wallet-val mono"></span>
      </div>
      <div class="wallet-row">
        <span class="wallet-label">ETH Balance</span>
        <span id="wallet-eth" class="wallet-val"></span>
      </div>
      <div class="wallet-row" id="price-row" style="display:none">
        <span class="wallet-label">ETH Price</span>
        <span id="wallet-price" class="wallet-val"></span>
      </div>
    </div>

    <label for="recipient">Recipient address</label>
    <input type="text" id="recipient" placeholder="0x..." />

    <label for="amount">Amount (USDT)</label>
    <input type="number" id="amount" placeholder="1.0" step="0.000001" min="0" />

    <button id="send-btn">Send USDT</button>
    <button id="cancel-btn" class="cancel-btn">Cancel Pending Transactions</button>

    <div id="status" class="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
